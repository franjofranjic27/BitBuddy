site_name: BitBuddy
site_description: Experimental crypto trading bot — Spring Boot microservices, Kafka, Helm
site_url: https://franjofranjic27.github.io/BitBuddy/
repo_url: https://github.com/franjofranjic27/BitBuddy
repo_name: franjofranjic27/BitBuddy

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - Commit Convention: COMMIT_CONVENTION.md
  - Testing: TESTING.md
  - CI/CD Workflows: WORKFLOWS.md
